<main class="flex items-center justify-center px-6 py-16 min-h-[calc(100vh-64px)] bg-[#fcf8fd]">
  <div class="w-full max-w-[440px]">
    <!-- Brand -->
    <div class="mb-8 text-center">
      <h1 class="text-2xl font-extrabold text-[#070235] tracking-tight">E-Store</h1>
      <p class="text-[#47464f] text-sm mt-1">Precision commerce for modern businesses.</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl card-shadow border border-[#c8c5d0]/50 p-8">
      <h2 class="text-xl font-bold text-[#1c1b1f] mb-6">Welcome back</h2>

      @if (submitted) {
        <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-5 flex items-center gap-3">
          <span class="material-symbols-outlined text-green-600 text-[20px]" style="font-variation-settings:'FILL' 1">check_circle</span>
          <p class="text-sm text-green-700 font-medium">Logged in successfully!</p>
        </div>
      }

      <div class="space-y-5">
        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-[#47464f] mb-1.5 px-1">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#787680] text-[20px]">mail</span>
            <input type="email" [(ngModel)]="form.email" id="email" placeholder="name@company.com"
              class="input-field pl-10"/>
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex justify-between items-center mb-1.5 px-1">
            <label class="text-xs font-semibold text-[#47464f]" for="password">Password</label>
            <a href="#" class="text-xs text-[#8683ba] hover:text-[#070235] transition-colors">Forgot password?</a>
          </div>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#787680] text-[20px]">lock</span>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" id="password" placeholder="••••••••"
              class="input-field pl-10 pr-10"/>
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[#787680] hover:text-[#47464f]">
              <span class="material-symbols-outlined text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <label class="flex items-center gap-2 px-1 cursor-pointer">
          <input type="checkbox" [(ngModel)]="form.remember" class="w-4 h-4 rounded border-[#c8c5d0] text-[#818CF8]"/>
          <span class="text-xs text-[#47464f] select-none">Remember this device for 30 days</span>
        </label>

        <!-- Submit -->
        <button (click)="onSubmit()" class="btn-primary w-full py-3 flex justify-center">
          Sign In
        </button>

        <!-- Divider -->
        <div class="relative flex items-center gap-3">
          <div class="flex-1 h-px bg-[#c8c5d0]"></div>
          <span class="text-xs text-[#787680]">or</span>
          <div class="flex-1 h-px bg-[#c8c5d0]"></div>
        </div>

        <!-- Google SSO placeholder -->
        <button class="btn-secondary w-full py-2.5 flex items-center justify-center gap-2">
          <span class="material-symbols-outlined text-[20px]">account_circle</span>
          Continue with Google
        </button>

        <p class="text-center text-sm text-[#5c5f60]">
          Don't have an account?
          <a routerLink="/register" class="text-[#818CF8] font-semibold hover:underline ml-1">Create one</a>
        </p>
      </div>
    </div>
  </div>
</main>
