<main class="flex-grow flex items-center justify-center px-6 py-16 bg-[#fcf8fd] relative overflow-hidden min-h-[calc(100vh-64px)]">
  <!-- Decorative blobs -->
  <div class="absolute -top-48 -right-48 w-96 h-96 bg-[#1e1b4b] rounded-full blur-[120px] opacity-10 pointer-events-none"></div>
  <div class="absolute -bottom-48 -left-48 w-96 h-96 bg-[#5b598c] rounded-full blur-[120px] opacity-10 pointer-events-none"></div>

  <div class="w-full max-w-[500px] z-10">
    <!-- Card -->
    <div class="bg-white rounded-2xl card-shadow p-8 border border-[#c8c5d0]/50">
      <div class="mb-8">
        <h1 class="text-2xl font-bold text-[#070235]">Create an account</h1>
        <p class="text-[#5c5f60] text-sm mt-1">Join E-Store for a premium shopping experience.</p>
      </div>

      @if (submitted) {
        <div class="bg-green-50 border border-green-200 rounded-xl p-4 mb-6 flex items-center gap-3">
          <span class="material-symbols-outlined text-green-600 text-[20px]" style="font-variation-settings:'FILL' 1">check_circle</span>
          <p class="text-sm text-green-700 font-medium">Account created successfully! Welcome to E-Store.</p>
        </div>
      }

      <div class="space-y-5">
        <!-- Name grid -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-[#47464f] mb-1.5">First Name</label>
            <input type="text" [(ngModel)]="form.firstName" placeholder="John" class="input-field"/>
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#47464f] mb-1.5">Last Name</label>
            <input type="text" [(ngModel)]="form.lastName" placeholder="Doe" class="input-field"/>
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-semibold text-[#47464f] mb-1.5">Email Address</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#787680] text-[20px]">mail</span>
            <input type="email" [(ngModel)]="form.email" placeholder="name@company.com"
              class="input-field pl-10"/>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-xs font-semibold text-[#47464f] mb-1.5">Password</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#787680] text-[20px]">lock</span>
            <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="form.password" placeholder="Min. 8 characters"
              class="input-field pl-10 pr-10"/>
            <button type="button" (click)="showPassword = !showPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-[#787680] hover:text-[#47464f]">
              <span class="material-symbols-outlined text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>

        <!-- Confirm Password -->
        <div>
          <label class="block text-xs font-semibold text-[#47464f] mb-1.5">Confirm Password</label>
          <input type="password" [(ngModel)]="form.confirmPassword" placeholder="Repeat your password"
            class="input-field"
            [class.border-red-400]="form.confirmPassword && !passwordsMatch"
            [class.border-green-400]="form.confirmPassword && passwordsMatch"/>
          @if (form.confirmPassword && !passwordsMatch) {
            <p class="text-xs text-red-500 mt-1">Passwords do not match</p>
          }
        </div>

        <!-- Terms -->
        <label class="flex items-start gap-2 cursor-pointer">
          <input type="checkbox" [(ngModel)]="form.agreeTerms" class="mt-0.5 rounded border-[#c8c5d0] text-[#818CF8]"/>
          <span class="text-xs text-[#47464f]">I agree to the <a href="#" class="text-[#818CF8] font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-[#818CF8] font-semibold hover:underline">Privacy Policy</a></span>
        </label>

        <!-- Submit -->
        <button (click)="onSubmit()"
          [disabled]="!form.agreeTerms || !passwordsMatch"
          class="btn-primary w-full py-3 justify-center flex disabled:opacity-50 disabled:cursor-not-allowed">
          Create Account
        </button>

        <p class="text-center text-sm text-[#5c5f60]">
          Already have an account?
          <a routerLink="/login" class="text-[#818CF8] font-semibold hover:underline ml-1">Sign in</a>
        </p>
      </div>
    </div>
  </div>
</main>
